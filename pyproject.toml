[project]
name = "keepgram"
version = "0.1.0"
description = "Keep your Telegram files your own: sort your channels and groups into folders, re-upload what depends on other people's posts, upload whole folders from disk"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.45,<2",
    # The menus (keepgram/ui/), same toolkit as remanga's.
    "textual>=8.2",
]

[project.optional-dependencies]
# Native AES for Telethon - uploads and downloads several times faster. Optional
# because it needs a wheel (or a compiler) for your Python; run.sh tries it first.
fast = ["cryptg>=0.4"]

[project.scripts]
keepgram = "keepgram.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keepgram"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["keepgram"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4"]
